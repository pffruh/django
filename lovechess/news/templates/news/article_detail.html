{% extends 'main\_base.html' %}

{% block title %}{{ article.title }}{% endblock %}

{% block content %}
<div class="features">
    <h2>{{ article.title }}</h2>
    <p> {{ article.date }}</p>
    <p> {{ article.full_text }}</p> <br>

    <a href="{% url 'update_news' article.id %}" class="btn btn-info">Изменить</a>
    <a href="{% url 'delete_news' article.id %}" class="btn btn-danger">Удалить</a>
    <a href="{% url 'news' %}" class="btn btn-warning">Назад</a>

</div>
{% endblock %}
